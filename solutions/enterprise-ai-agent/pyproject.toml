[project]
name = "enterprise-ai"
version = "0.1.0"
description = "The Enterprise AI agent."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Pierrick Voulet" }
]
dependencies = [
    "google-adk (>=1.28.1,<2.0.0)",
    "google-api-core>=2.29.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.148.1",
    "google-genai>=2.9.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
    "typing-extensions>=4.12.2",
    "google-cloud-discoveryengine (>=0.13.12,<0.14.0)",
    "google-apps-chat (>=0.6.0,<0.7.0)",
    "starlette>=1.3.1,<2.0.0",
    "authlib>=1.8.0,<2.0.0",
    "requests>=2.33.0,<3.0.0",
]

[tool.poetry.group.dev.dependencies]
jinja2 = ">=3.1.6,<4.0.0"
nltk = ">=3.10.4"
pandas = ">=2.2.3"
rouge-score = ">=0.1.2"
tabulate = ">=0.9.0"

[tool.poetry.group.deployment.dependencies]
absl-py = ">=2.2.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
